[project]
name = "kyc-onboarding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "glenwoodanthony" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.4",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "pillow>=10.1",
]
# Optional and large: install with `uv sync --group ocr`.
ocr = [
    "paddlepaddle-gpu==3.2.1",
    "paddleocr[doc-parser]>=3.7.0",
    # The Windows Paddle wheel doesn't bundle cuDNN (Linux gets it via Paddle's own
    # deps). Matches the version Paddle's Linux build pins. api/ocr.py puts its DLLs on PATH.
    "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'win32'",
]

# paddlepaddle-gpu isn't on PyPI. `explicit` means only packages pinned below come from here.
[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ocr: runs real OCR models (needs `uv sync --group ocr`)"]
