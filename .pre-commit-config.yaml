repos:
  # Secret scanning runs first. gitleaks is a Go tool, not a project dependency, so it
  # comes from the official hook repo pinned to a release tag.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Local hooks: run the ruff and pyright versions pinned in uv.lock via `uv run`,
  # so nothing is downloaded from GitHub and hook versions never drift from the project's.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        # Type-check the whole project, not just changed files, so cross-file errors are caught.
        pass_filenames: false
